<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XFX Plain H5 Fine Tune Diagnostic</title><style>body{font:16px ui-monospace,monospace;background:#090c11;color:#e8edf5;padding:24px}button{font-size:18px;padding:14px}pre{white-space:pre-wrap}canvas{width:270px;height:360px;background:#000}</style></head><body><h1>Plain H5 Renderer Diagnostic</h1><p>DEV-only deterministic 360×480 fixture, 20 brightness changes.</p><button id="run">Run 20 steps</button><canvas id="canvas" width="360" height="480"></canvas><pre id="result">READY</pre><script>
const W=360,H=480,source=new Uint8ClampedArray(W*H*4);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;source[i]=x/W*255;source[i+1]=y/H*255;source[i+2]=(x+y)/(W+H)*255;source[i+3]=255}
const pct=(a,p)=>[...a].sort((x,y)=>x-y)[Math.min(a.length-1,Math.floor(a.length*p))]||0,clamp=v=>Number.isFinite(v)?Math.max(-1,Math.min(1,v)):0,byte=v=>Number.isFinite(v)?Math.max(0,Math.min(255,Math.round(v))):0,brightness=(channel,stops)=>(1-Math.pow(1-Math.max(0,Math.min(1,channel/255)),Math.pow(2,stops)))*255;const render=v=>{const out=new Uint8ClampedArray(source.length),all=[v,0,0,0,0],person=[0,0,0,0,0],background=[0,0,0,0,0],local=new Map;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const pixel=y*W+x,i=pixel*4,pw=0,bw=0,values=all.map((n,j)=>n+person[j]*pw+background[j]*bw);for(const entry of local.values())void entry;let r=source[i],g=source[i+1],b=source[i+2],stops=clamp(values[0])*.32;r=brightness(r,stops);g=brightness(g,stops);b=brightness(b,stops);const warm=clamp(values[1]);r+=warm*14;g+=warm*2;b-=warm*16;const saturation=1+clamp(values[2])*.28,luma=r*.2126+g*.7152+b*.0722;r=luma+(r-luma)*saturation;g=luma+(g-luma)*saturation;b=luma+(b-luma)*saturation;out[i]=byte(r);out[i+1]=byte(g);out[i+2]=byte(b);out[i+3]=source[i+3]}return out};
document.querySelector('#run').onclick=async()=>{const times=[],ctx=document.querySelector('canvas').getContext('2d'),started=performance.now();let longCount=0,longMax=0,observer;try{observer=new PerformanceObserver(list=>list.getEntries().forEach(e=>{longCount++;longMax=Math.max(longMax,e.duration)}));observer.observe({entryTypes:['longtask']})}catch{}for(let n=0;n<20;n++){const t=performance.now(),data=render(-1+n*2/19);ctx.putImageData(new ImageData(data,W,H),0,0);times.push(performance.now()-t);await new Promise(r=>requestAnimationFrame(r))}await new Promise(r=>setTimeout(r,80));observer&&observer.disconnect();document.querySelector('#result').textContent=JSON.stringify({samples:20,p50:pct(times,.5),p95:pct(times,.95),max:Math.max(...times),elapsed:performance.now()-started,longTaskCount:longCount,longTaskMax:longMax},null,2)};
</script></body></html>
