[project]
name = "xfx-api"
version = "0.1.0"
description = "AI Photographer production-shaped API"
requires-python = "==3.14.7"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "python-multipart==0.0.20",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
